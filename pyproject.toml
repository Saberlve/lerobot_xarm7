[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_ufactory"
version = "0.1.0"
description = "UFACTORY 机械臂与 LeRobot 框架集成"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "lerobot_robot_ufactory Contributors" },
]
keywords = ["robotics", "lerobot", "ufactory", "xarm", "imitation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml",
    "lerobot[intelrealsense]==0.4.3",
    "xarm-python-sdk",
    "opencv-python==4.11.0.86",
    "websockets",
    "aiohttp>=3.14.3,<4",
    "msgpack",
]

[project.scripts]
uf-lerobot-record-web = "lerobot_robot_ufactory.utils.webapp.uf_lerobot_record_web:main"
uf-gello-tune-web = "lerobot_robot_ufactory.current_control.web.tuning_web:main"
uf-robot-teleop = "lerobot_robot_ufactory.scripts.uf_robot_teleop:main"
uf-lerobot-record = "lerobot_robot_ufactory.scripts.uf_lerobot_record:main"
record = "lerobot_robot_ufactory.scripts.uf_lerobot_record:main"
uf-lerobot-eval = "lerobot_robot_ufactory.scripts.uf_lerobot_eval:main"
uf-lerobot-replay = "lerobot_robot_ufactory.scripts.uf_lerobot_replay:main"
replay = "lerobot_robot_ufactory.scripts.uf_lerobot_replay:main"
uf-vive-calibrate = "lerobot_robot_ufactory.scripts.vive_calibrate:main"
uf-camera-view = "lerobot_robot_ufactory.scripts.uf_camera_view:main"
uf-realsense-view = "lerobot_robot_ufactory.scripts.uf_realsense_view:main"
uf-camera-test = "lerobot_robot_ufactory.scripts.uf_camera_test:main"
uf-read-tcp-z = "lerobot_robot_ufactory.scripts.uf_read_tcp_z:main"
uf-read-g2-current = "lerobot_robot_ufactory.scripts.uf_read_g2_current:main"
uf-test-gello-gripper-current = "lerobot_robot_ufactory.scripts.uf_test_gello_gripper_current:main"
uf-test-gripper-force-feedback = "lerobot_robot_ufactory.scripts.uf_test_gripper_force_feedback:main"

[project.optional-dependencies]
# Xense Photon tactile images (inference disabled by default).
xense = ["xensesdk>=2.0.0,<3"]
# Offline Mesh3DFlow on NVIDIA GPUs; CUDA/cuDNN libraries come from PyTorch.
xense-gpu = ["xensesdk>=2.0.0,<3", "onnxruntime-gpu==1.23.2"]
# GELLO 遥操作
gello = [
    "gello @ git+https://github.com/xArm-Developer/gello_software.git",
    "dynamixel-sdk>=4.0.5",
]
# SpaceMouse 遥操作
spacemouse = [
    "spnav @ git+https://github.com/kazoo-osaro/spnav",
]
# 开发工具
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.uv]
# LeRobot depends on the headless OpenCV wheel, while this project needs GUI
# APIs such as imshow/namedWindow. Installing both wheels corrupts the shared
# cv2 package, so keep only the GUI-enabled wheel declared above.
exclude-dependencies = [
    "opencv-python-headless",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lerobot_robot_ufactory.utils.webapp" = ["recording_web_assets/*.html"]
"lerobot_robot_ufactory.devices.umi.xvlib" = ["*.so", "*.so.*"]
"lerobot_robot_ufactory.current_control.web" = ["viewer_assets/*.html", "viewer_assets/*.js", "viewer_assets/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# Explicit runtime requirements from the 2.0.1 wheel, absent in the old lock.
# Keep uv resolution consistent with the installed wheel metadata.
[[tool.uv.dependency-metadata]]
name = "xensesdk"
version = "2.0.1"
requires-dist = [
    "cypack>=0.1.2",
    "numpy<=2.2.4",
    "opencv-python<=4.12.0.88",
    "pillow>=10.2.0",
    "cryptography==43.0.3",
    "PyYAML==6.0.2",
    "ormsgpack>=1.11.0",
    "lz4",
    "psutil>=5.9.0",
    "wmi; platform_system == \"Windows\"",
    "pyudev; platform_system == \"Linux\"",
    "cyclonedds-nightly==2025.7.29",
]
