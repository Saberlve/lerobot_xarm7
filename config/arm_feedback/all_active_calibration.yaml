# Stage B: ALL seven joints active simultaneously, static first-pass config.
# Merged from the per-joint calibrated yamls (j1..j7_active_calibration.yaml).
# Every per-joint value is the hardware-validated one; see each single-joint
# yaml for its calibration evidence.
#
# NOTE: all seven baselines are only valid at the pose where they were
# measured; this merged vector assumes every joint's baseline was taken at
# the SAME static pose. Verify residuals ~0 in an observe-only run at that
# pose before going active.
arm_feedback:
  enabled: true
  observe_only: false

  source: bias_compensated_joint_effort

  sampling_hz: 20
  update_hz: 100
  leader_read_hz: 10

  stale_timeout_ms: 500

  baseline:
  - 0.0
  - -4.796127
  - 0.518214
  - 17.397564
  - -0.115557
  - -1.83963
  - 0

