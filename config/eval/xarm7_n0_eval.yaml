single_task: Pick up the egg and place it in the green egg tray.
# Expected checkpoint horizon; checked before connecting the robot.
action_chunk_size: 25
# Execute this many actions before requesting the next prediction.
steps_per_inference: 12

# Default: connected dry run, no reset or arm/gripper targets. --execute enables motion.
dry_run: true

n_episodes: 1
max_episode_steps: 900
rgb_keys: [third_camera, wrist_camera]
tactile_keys: [photon_left, photon_right]

# IK is seeded from the last sent joints and checked against the recording FK.
max_joint_step_deg: 90
ik_position_tolerance_mm: 2
ik_rotation_tolerance_deg: 2

robot:
  type: uf::robot
  robot_dof: 7
  control_space: joint
  record_space: both
  robot_ip: 192.168.1.245
  gripper_speed: 50
  gripper_command_interval_s: 0.03334
  max_joint_velocity: 120
  min_tcp_z_mm: 2
  cameras:
    wrist_camera:
      type: intelrealsense
      serial_number_or_name: '242622070583'
      width: 640
      height: 480
      fps: 15
    third_camera:
      type: intelrealsense
      serial_number_or_name: '148522072685'
      width: 640
      height: 480
      fps: 15
    photon_left:
      type: photon
      serial_number: OG001932
      width: 400
      height: 700
      fps: 60
    photon_right:
      type: photon
      serial_number: OG001931
      width: 400
      height: 700
      fps: 60

# Policy server and control frequency (N0 J: H25/E12, 15 Hz).
server_host: 127.0.0.1
server_port: 10093
fps: 15
