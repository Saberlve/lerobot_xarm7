# Training config: train_files/configs/tasks/nut_tighten/FTP1_nut_tighten_baseline.yaml
deployment_profile: xarm7_eef_ftp1
action_space: eef10
single_task: "Find the bolt with a nut and tighten the nut."
action_chunk_size: 15  # 对应训练配置的 chunk_size / action_horizon
steps_per_inference: 10  # 每执行 10 个动作步后重新推理
server_host: 127.0.0.1
server_port: 10093
state_stats_key: ''
dry_run: true
fps: 15
temporal_ensemble: false
n_episodes: 1
max_episode_steps: 900
camera_keys:
- third_camera
- wrist_camera
tactile_keys:
- photon_left
- photon_right
# Maximum change from measured pose or the previous Cartesian target.
max_tcp_step_mm: 75
max_tcp_rotation_step_deg: 45
robot:
  type: uf::robot
  id: uf_robot
  robot_dof: 7
  # Absolute XYZ (mm) + RPY (rad), sent with set_position in mode 7.
  control_space: cartesian
  # Joint-feedback FK supplies the original EEF10 policy state.
  record_space: joint
  robot_ip: 192.168.1.245
  gripper_type: 2
  gripper_speed: 50
  gripper_force: 50
  gripper_command_interval_s: 0.03334
  max_linear_velocity: 100  # mm/s
  min_tcp_z_mm: 2
  tcp_z_guard_backend: local_projection
  controller_safety_boundary: true
  enable_logs: false
  cameras:
    wrist_camera:
      type: intelrealsense
      serial_number_or_name: '242622070583'
      width: 640
      height: 480
      fps: 15
    third_camera:
      type: intelrealsense
      serial_number_or_name: '148522072685'
      width: 640
      height: 480
      fps: 15
    photon_left:
      type: photon
      serial_number: OG001932
      width: 400
      height: 700
      fps: 60
    photon_right:
      type: photon
      serial_number: OG001931
      width: 400
      height: 700
      fps: 60
