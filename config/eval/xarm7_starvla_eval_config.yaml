single_task: "Pick up the egg and place it in the green egg tray."
# Expected predicted chunk length (checkpoint action_horizon); checked at connection.
# Changing this value requires a checkpoint with the matching chunk length.
action_chunk_size: 25
# Execute this many actions before requesting the next prediction.
steps_per_inference: 12

# PI05/ACT egg checkpoints: EEF10, 15 Hz, H25/E12.
policy_representation: eef10
dry_run: false
max_episode_steps: 900
max_joint_step_deg: 90
ik_position_tolerance_mm: 2
ik_rotation_tolerance_deg: 2

# Real-robot EEF10 evaluation via scripts/uf_starvla_eval.py.
robot:
  type: uf::robot
  robot_dof: 7
  control_space: "joint"
  record_space: "both"
  robot_ip: "192.168.1.245"
  # xArm Gripper G2 speed, 15-225 mm/s. Match the data-collection config
  # (xarm7_gello_pick_toothpaste.yaml uses 50) so grasp timing matches training.
  gripper_speed: 50
  max_joint_velocity: 120
  # TCP z floor in the xArm base coordinate system (mm).
  min_tcp_z_mm: -2.0
  # Append gripper initialization/read/write failures here.
  gripper_error_log_path: "logs/xarm7_gripper_errors.log"
  cameras:
    # Wrist view, trained as left_wrist_0_rgb.
    wrist_camera:
      type: intelrealsense
      serial_number_or_name: "242622070583"
      width: 640
      height: 480
      fps: 15
    # External upper view, trained as base_0_rgb.
    third_camera:
      type: intelrealsense
      serial_number_or_name: "148522072685"
      width: 640
      height: 480
      fps: 15

# starVLA policy server address (server binds 0.0.0.0; set the server IP here
# if the server runs on a different machine).
server_host: "127.0.0.1"
server_port: 10093

# Control frequency for streaming actions to the robot.
fps: 15
n_episodes: 1
# Camera observation keys sent to the policy, IN ORDER. Must match the training
# video_keys order ["video.external_upper_camera", "video.wrist_camera"], i.e.
# external (base_0_rgb) first, wrist (left_wrist_0_rgb) second.
camera_keys: ["third_camera", "wrist_camera"]
