# Real-robot eval config for uf-starvla-eval (external starVLA policy server).
# Robot section is derived from config/gello/xarm7_gello_record_config.yaml
# (teleop / dataset / web_preview sections removed).
robot:
  type: uf::robot
  id: "uf_robot"
  robot_dof: 7
  control_space: "joint"
  # TODO: confirm this is your xArm controller IP.
  robot_ip: "192.168.1.245"
  # 2: xArm Gripper G2 (0-84 mm opening range).
  gripper_type: 2
  enable_logs: false
  # xArm Gripper G2 speed, 15-225 mm/s. Match the data-collection config
  # (xarm7_gello_pick_toothpaste.yaml uses 50) so grasp timing matches training.
  gripper_speed: 50
  # xArm Gripper G2 gripping force, 1-100 percent; 50 is the SDK default.
  gripper_force: 50
  # Use the high-frequency servo interface for lower-latency action streaming.
  joint_command_mode: 6
  max_joint_velocity: 120
  # TCP z floor in the xArm base coordinate system (mm).
  min_tcp_z_mm: -2.0
  # CPU-local FK/Jacobian projection keeps mode-6 commands free of synchronous SDK queries.
  tcp_z_guard_backend: "local_projection"
  tcp_z_soft_margin_mm: 0.5
  local_kinematics_max_error_mm: 2.0
  controller_safety_boundary: true
  # Append gripper initialization/read/write failures here.
  gripper_error_log_path: "logs/xarm7_gripper_errors.log"
  cameras:
    # Same cameras as config/gello/xarm7_gello_pick_toothpaste.yaml.
    # observation.images.camera  = wrist_camera           (trained as left_wrist_0_rgb)
    # observation.images.camera2 = external_upper_camera  (trained as base_0_rgb)
    camera:
      type: intelrealsense
      serial_number_or_name: "242622070583"
      width: 640
      height: 480
      fps: 30
    camera2:
      type: intelrealsense
      serial_number_or_name: "148522072685"
      width: 640
      height: 480
      fps: 30

# starVLA policy server address (server binds 0.0.0.0; set the server IP here
# if the server runs on a different machine).
server_host: "127.0.0.1"
server_port: 10093

# Control frequency for streaming actions to the robot.
fps: 30
# Execute the first N steps of each predicted action chunk (chunk length comes
# from the checkpoint's action_horizon), then re-infer.
# N=1 means fully closed-loop (re-infer every step).
steps_per_inference: 20
single_task: "Pick up the white bar and drop it in the bag."
n_episodes: 50
# Camera observation keys sent to the policy, IN ORDER. Must match the training
# video_keys order ["video.external_upper_camera", "video.wrist_camera"], i.e.
# external (base_0_rgb) first, wrist (left_wrist_0_rgb) second.
camera_keys: ["camera2", "camera"]

# Diagnostic CSV logs (30 Hz state/action steps + per-chunk seam diffs),
# written to logs/starvla_eval_<timestamp>_{steps,seams}.csv. Set to false to
# skip creating them entirely.
enable_logs: true
# Directory for the diagnostic logs (only used when enable_logs is true).
log_dir: "logs"

# REQUIRED: training-time dataset_statistics.json (state q01/q99). The policy
# expects q99-normalized state; the server does NOT normalize it. Point this at
# the stats file belonging to the checkpoint the server is running.
dataset_statistics_path: "/usr/share/EmbodiedAI/VLArmory/results/Checkpoints/xarm7_pi05_lora_merged/dataset_statistics.json"
# Top-level key in dataset_statistics.json ("" = auto-pick when single key).
state_stats_key: ""
