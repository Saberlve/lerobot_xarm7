# Task: 齿轮装配
# Settings copied from config/gello/xarm7_gello_base.yaml; this is a standalone config.
# Run from the project root:
# .venv/bin/uf-lerobot-record --config_path config/gello/tasks/gear_assembly/xarm7_gello_gear_assembly.yaml

synchronize: true
# Checkpoint raw images/data during recording; process episodes after recording ends.
defer_processing: true
# Compute Mesh3DFlow from saved Rectify images and write the results to the dataset:
# observation.photon_right.mesh_motion_3d / observation.photon_left.mesh_motion_3d.
# This offline output is enabled even though save_marker_motion_3d above is false.
offline_mesh3dflow: true
robot:
  type: uf::robot
  id: "uf_robot"
  robot_dof: 7
  control_space: "joint"
  # Saved dataset representation: "joint" records J1..J7 (rad); "tcp" records
  # the FK-converted TCP pose (mm; continuous 6D rotation, Zhou et al. CVPR 2019);
  # "both" records joints and TCP pose side by side. Control stays in joint space.
  record_space: "both"
  robot_ip: "192.168.1.245"
  # 2: xArm Gripper G2 (0-84 mm opening range).
  gripper_type: 2
  gripper_speed: 50
  gripper_command_interval_s: 0.03334
  gripper_current_monitor: false
  enable_logs: false
  # Use xArm mode 6 online joint trajectory planning for GELLO tracking.
  joint_command_mode: 6
  max_joint_velocity: 120
  # TCP z floor in the xArm base coordinate system (mm).
  min_tcp_z_mm: 99
  # CPU-local FK/Jacobian projection keeps mode-6 commands free of synchronous SDK queries.
  tcp_z_guard_backend: "local_projection"
  tcp_z_soft_margin_mm: 0.5
  local_kinematics_max_error_mm: 2.0
  controller_safety_boundary: true
  # Append gripper initialization/read/write failures here.
  gripper_error_log_path: "logs/xarm7_gripper_errors.log"
  cameras:
    wrist_camera:
      type: intelrealsense
      serial_number_or_name: "242622070583"
      width: 640
      height: 480
      # Select the latest host-received frame at/before each action send-start.
      fps: 15
    third_camera:
      type: intelrealsense
      serial_number_or_name: "148522072685"
      width: 640
      height: 480
      fps: 15
    # Physical left/right mapping verified by pressing the left sensor: OG001932.
    # These dimensions are saved image sizes, not a Photon hardware mode.
    photon_right: # 右边
      type: photon
      serial_number: "OG001931"
      width: 400
      height: 700
      fps: 60  # 最终按60hz采触觉
      output_type: Rectify
      color_mode: rgb
      # Recording phase: save Rectify images without running SDK inference.
      disable_infer: true
      # Only controls live SDK 3D output during recording, not offline saving.
      # Keep false here; offline_mesh3dflow below enables post-recording computation/saving.
      save_marker_motion_3d: false
      motion_3d_output: Mesh3DFlow
      infer_mode: fast
      marker_rows: 35
      marker_cols: 20
      # config_path: /absolute/path/to/xense/calibrations
    photon_left:  # 左边
      type: photon
      serial_number: "OG001932"
      width: 400
      height: 700
      fps: 60
      output_type: Rectify
      color_mode: rgb
      # Recording phase: save Rectify images without running SDK inference.
      disable_infer: true
      # Only controls live SDK 3D output during recording, not offline saving.
      # Keep false here; offline_mesh3dflow below enables post-recording computation/saving.
      save_marker_motion_3d: false
      motion_3d_output: Mesh3DFlow
      infer_mode: fast
      marker_rows: 35
      marker_cols: 20
      # config_path: /absolute/path/to/xense/calibrations
  # Redundant args, indicating the initial pose of xarm7. Set by 192.168.1.245:18333
  # start_joints: [0, -30, 0, 0, 0, 30, 0]
# make sure to edit with your correct configurations!
teleop:
  current_control:
    enabled: true
    profile_path: config/current_control/gello_A_working.yaml
    experimental: false
    # Running current slew is loaded from the shared device profile.
  type: uf::gello_teleop
  id: "gello_teleop"
  # Independent GELLO -> xArm command loop; dataset.fps remains the recording rate.
  realtime_control_fps: 30
  port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTB9HYVD-if00-port0"
  joint_ids: [1, 2, 3, 4, 5, 6, 7]
  joint_signs: [1, 1, 1, 1, 1, 1, 1]
  gripper_id: 8
  gripper_control_mode: keyboard
  gripper_keyboard_hold_delay_s: 0.0
  gripper_keyboard_step_mm: 1.0
  gripper_open_deg: 198.28125
  gripper_close_deg: 155.75

# Lossy browser preview of the frames already captured for the dataset.
# JPEG encoding and network I/O run in the background; preview frames are
# dropped instead of delaying the 15 Hz recorder or 30 Hz GELLO control loop.
web_preview:
  enabled: false
  host: "0.0.0.0"
  port: 8769
  fps: 8
  width: 480
  jpeg_quality: 65



dataset:
  # Dataset path relative to the directory where the command is started.
  root: "datasets/xarm7_gello_tasks/gear_assembly"
  repo_id: "ufactory/xarm7_gello_gear_assembly"
  # Task description stored in the dataset.
  single_task: "Grasp the gear, align its bore with the fixed shaft, adjust the alignment during contact, insert it to the target depth, then release the gear and withdraw."
  fps: 15
  episode_time_s: 960  # max duration for one episode
  reset_time_s: 20    # time for resetting env between episodes
  push_to_hub: False
